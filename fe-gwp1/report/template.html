<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$pagetitle$</title>
<style>
  body { font-family: "Georgia", "DejaVu Serif", serif; font-size: 10.5pt; line-height: 1.45; color: #111; max-width: 170mm; margin: 0 auto; }
  h1 { font-size: 17pt; margin: 0.2em 0 0.4em; border-bottom: 2px solid #1d3557; padding-bottom: 4px; color: #1d3557; page-break-after: avoid; }
  h2 { font-size: 13.5pt; margin: 1.3em 0 0.4em; color: #1d3557; page-break-after: avoid; }
  h3 { font-size: 11.5pt; margin: 1.1em 0 0.3em; page-break-after: avoid; }
  p { margin: 0.45em 0; text-align: justify; }
  blockquote { margin: 0.6em 0; padding: 0.4em 0.9em; background: #f1f4f8; border-left: 4px solid #1d3557; color: #222; }
  blockquote p { margin: 0.2em 0; }
  table { border-collapse: collapse; margin: 0.7em auto; font-size: 8.3pt; font-family: "DejaVu Sans", Arial, sans-serif; page-break-inside: avoid; }
  th, td { border-bottom: 1px solid #ccd; padding: 2px 6px; }
  th { border-bottom: 1.5px solid #1d3557; background: #f5f7fa; }
  figure { margin: 0.8em 0; text-align: center; page-break-inside: avoid; }
  figure img, p img { max-width: 100%; }
  figcaption { font-size: 9pt; color: #444; margin-top: 2px; }
  .pagebreak { page-break-after: always; }
  .katex-display { margin: 0.6em 0; overflow-x: auto; overflow-y: hidden; }
  .katex { font-size: 1.05em; }
  ul, ol { margin: 0.3em 0 0.3em 1.2em; padding-left: 0.6em; }
  li { margin: 0.15em 0; }
  code { font-size: 9pt; }
  .cover td, .cover th { font-size: 9.5pt; padding: 6px 10px; }
</style>
</head>
<body>
$body$
</body>
</html>
